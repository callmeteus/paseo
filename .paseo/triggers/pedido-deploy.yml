name: pedido-deploy
enabled: true
max_runtime: 3h
"on":
  slack.message:
    connection: slack-t0959u3jjtb
    filters:
      from_users:
        - "*"
      channels:
        - C096XDA2478
      include_bots: true
      contains_any:
        - Deploy Request
  slack.mention:
    connection: slack-t0959u3jjtb
    filters:
      from_users:
        - "*"
      channels:
        - C096XDA2478
run:
  target:
    daemon: gio-predator-phn16-71
    cwd: /home/gio/luckymaker-workspace
  guardrails:
    - id: slack.same_channel
    - id: slack.same_thread
  reactions:
    - id: kind
      agent:
        provider: cursor
        mode: agent
        model: grok-4.7
        thinkingOptionId: high
        features:
          fast: "false"
      continuation:
        mode: new
      max_runtime: 10m
      idle_timeout: 2m
      output:
        schema:
          type: object
          additionalProperties: false
          required:
            - kind
          properties:
            kind:
              type: string
              enum:
                - deploy
                - followup
                - silence
      prompt: |
        Você só classifica a mensagem que abriu esta execução.
        Não compile, não faça GET e não escreva no Slack. Nem reply, nem react, nem a API do Slack, nem curl, nem shell, nem outra ferramenta.

        kind é deploy quando o texto da mensagem é o card novo do pedido, com Deploy Request e um número.
        kind é followup só quando a mensagem já está numa thread. No Contexto, trigger_message.thread não é null.
        kind é silence quando a mensagem está no canal. trigger_message.thread é null, ou trigger_thread_context.status é not_applicable, e o texto não é o card. Uma menção no canal, sem thread, também é silence.

        Termine com finish_execution. O output.kind é deploy, followup ou silence. Sem esse output a execução não segue.

        Mensagem:
        ${{ paseo.prompt }}

        Contexto:
        ${{ paseo.context }}
    - id: route
      if:
        condition: ${{ steps.kind.outputs.kind == 'deploy' }}
        then:
          - id: hold
            wait:
              for: 5m
          - id: creds
            env:
              files:
                - ~/.lm.credentials
                - ~/.lemon.credentials
          - id: gate
            http:
              method: GET
              url: https://e7bot.even7.dev/admin/api/deploys
              number_from_prompt: true
              headers:
                Authorization: "Bearer ${var:EVEN_AGENT_API_KEY:-${var:e7.apiKey}}"
          - id: open
            if:
              condition: ${{ steps.gate.outputs.open == true }}
              then:
                - id: claim
                  http:
                    method: POST
                    url: https://e7bot.even7.dev/admin/api/deploys
                    number_from_prompt: true
                    path: assign
                    headers:
                      Authorization: "Bearer ${var:EVEN_AGENT_API_KEY:-${var:e7.apiKey}}"
                - id: claimed
                  if:
                    condition: ${{ steps.claim.outputs.assigned == true }}
                    then:
                      - id: compile
                        agent:
                          provider: cursor
                          mode: agent
                          model: grok-4.7
                          thinkingOptionId: high
                          features:
                            fast: "false"
                        continuation:
                          mode: conversation
                        max_runtime: 2h
                        idle_timeout: 1h
                        slack_agent:
                          display: timeline
                          session_title: Deploy
                        github:
                          connection: even7hq-github
                          repositories:
                            - even7hq/buzzz
                            - even7hq/chat
                            - even7hq/e7
                            - even7hq/e7-router
                            - even7hq/even7-grafana
                            - even7hq/even7-sre
                            - even7hq/idtfy
                            - even7hq/lemon-bundler
                            - even7hq/lemon-debug
                            - even7hq/lemon-deploy
                            - even7hq/lemon-design-system
                            - even7hq/lemon-linting
                            - even7hq/lemon-shared
                            - even7hq/luckymaker
                            - even7hq/luckymaker-admin
                            - even7hq/luckymaker-app-maker
                            - even7hq/luckymaker-backend
                            - even7hq/luckymaker-chrome-extension
                            - even7hq/luckymaker-control-plane
                            - even7hq/luckymaker-design-system
                            - even7hq/luckymaker-display
                            - even7hq/luckymaker-embed
                            - even7hq/luckymaker-frontend
                            - even7hq/luckymaker-plugin-sdk
                            - even7hq/luckymaker-plugins
                            - even7hq/luckymaker-revendedor-frontend
                            - even7hq/luckymaker-shared
                            - even7hq/luckymaker-sorteador
                            - even7hq/luckymaker-tenants
                            - even7hq/luckymaker-totem-electron
                            - even7hq/proxygon
                            - even7hq/typr
                          permissions:
                            contents: write
                            metadata: read
                            pull_requests: write
                          duration: 1h
                        outputs:
                          slack.reply:
                            max: 20
                            required: true
                          slack.react:
                            max: 4
                        prompt:
                          - include:
                              path: partials/falar.md
                              root: /mnt/ssd2/software/paseo/.paseo/automations
                          - include:
                              path: partials/produto.md
                              root: /mnt/ssd2/software/paseo/.paseo/automations
                          - include:
                              path: partials/andamento.md
                              root: /mnt/ssd2/software/paseo/.paseo/automations
                          - include:
                              path: partials/compilar.md
                              root: /mnt/ssd2/software/paseo/.paseo/automations
                          - text: |
                              O Hub já leu o pedido e já fez o assign. Você não decide se o pedido está livre. Não faça GET, não faça POST, não leia variável de ambiente, não abra arquivo de credencial, não chame Infisical, não abra mcp.json e não vasculhe o disco.
                              Chame reply com o campo content. Não passe executionId. A linha Hub execution no começo do prompt é só identificação.

                              Mensagem:
                              ${{ paseo.prompt }}

                              Contexto:
                              ${{ paseo.context }}

                              Ignore entrada e saída de canal. Ignore mensagem que não é um pedido de deploy, uma menção a você, nem um aviso de que o deploy foi realizado.
                              O JSON abaixo é o pedido. Ele traz `buildAreas`, `tenants` (productId, name, appId), `deployToAll`, `branch`, `status`, `assignedTo`, `jiraTasks` e `suggestedCommands`. Se `branch` vier vazio, a base é master. Não abra o código para procurar defaultBranch.
                              ${{ steps.gate.outputs.body }}
                              Os 5 minutos depois da abertura deste pedido já passaram nesta automação. Não espere de novo. O assign já foi feito. Compile.
                    else:
                      - id: raced
                        notice:
                          text: O pedido ${{ steps.gate.outputs.number }} foi assumido por outra pessoa enquanto esta automação esperava. A compilação não começa.
              else:
                - id: taken
                  notice:
                    text: O pedido ${{ steps.gate.outputs.number }} já está em `${{ steps.gate.outputs.status }}`${{ steps.gate.outputs.assignee }}. A compilação não começa.
        else:
          - id: in-thread
            if:
              condition: ${{ steps.kind.outputs.kind == 'followup' }}
              then:
                - id: follow
                  agent:
                    provider: cursor
                    mode: agent
                    model: grok-4.7
                    thinkingOptionId: high
                    features:
                      fast: "false"
                  continuation:
                    mode: conversation
                  max_runtime: 2h
                  idle_timeout: 1h
                  slack_agent:
                    display: timeline
                    session_title: Deploy
                  github:
                    connection: even7hq-github
                    repositories:
                      - even7hq/buzzz
                      - even7hq/chat
                      - even7hq/e7
                      - even7hq/e7-router
                      - even7hq/even7-grafana
                      - even7hq/even7-sre
                      - even7hq/idtfy
                      - even7hq/lemon-bundler
                      - even7hq/lemon-debug
                      - even7hq/lemon-deploy
                      - even7hq/lemon-design-system
                      - even7hq/lemon-linting
                      - even7hq/lemon-shared
                      - even7hq/luckymaker
                      - even7hq/luckymaker-admin
                      - even7hq/luckymaker-app-maker
                      - even7hq/luckymaker-backend
                      - even7hq/luckymaker-chrome-extension
                      - even7hq/luckymaker-control-plane
                      - even7hq/luckymaker-design-system
                      - even7hq/luckymaker-display
                      - even7hq/luckymaker-embed
                      - even7hq/luckymaker-frontend
                      - even7hq/luckymaker-plugin-sdk
                      - even7hq/luckymaker-plugins
                      - even7hq/luckymaker-revendedor-frontend
                      - even7hq/luckymaker-shared
                      - even7hq/luckymaker-sorteador
                      - even7hq/luckymaker-tenants
                      - even7hq/luckymaker-totem-electron
                      - even7hq/proxygon
                      - even7hq/typr
                    permissions:
                      contents: write
                      metadata: read
                      pull_requests: write
                    duration: 1h
                  outputs:
                    slack.reply:
                      max: 20
                    slack.react:
                      max: 4
                  prompt:
                    - text: |
                        Você só fala dentro de uma thread que já existe.
                        Olhe o Contexto. Se trigger_message.thread for null, ou se trigger_thread_context.status for not_applicable, a mensagem está no canal. Chame finish_execution agora. Sem reply, sem react, sem curl, sem a API do Slack, sem shell e sem nenhuma ferramenta que poste no Slack.
                        Não explique no canal que você não viu o pedido.
                    - include:
                        path: partials/falar.md
                        root: /mnt/ssd2/software/paseo/.paseo/automations
                    - include:
                        path: partials/produto.md
                        root: /mnt/ssd2/software/paseo/.paseo/automations
                    - include:
                        path: partials/andamento.md
                        root: /mnt/ssd2/software/paseo/.paseo/automations
                    - include:
                        path: partials/compilar.md
                        root: /mnt/ssd2/software/paseo/.paseo/automations
                    - text: |
                        Mensagem:
                        ${{ paseo.prompt }}

                        Contexto:
                        ${{ paseo.context }}

                        Ignore entrada e saída de canal. Se a mensagem não é uma menção dentro da thread, nem um aviso de que o deploy foi realizado, chame finish_execution. Sem reply e sem react.
                        Quando precisar da API do pedido, leia uma vez o arquivo ~/.lm.credentials. Se ele não existir, leia ~/.lemon.credentials. O arquivo é dotenv. A chave é EVEN_AGENT_API_KEY, ou e7.apiKey se a primeira não estiver. O header é `Authorization: Bearer` com essa chave, e `X-Sanddbox-Actor` com o id em `event.slack.bot.id` no Contexto. Esse é o bot que executa o deploy. Não use o autor da mensagem, nem quem pediu o deploy, nem o app que publicou o card. Não imprima a chave. Não abra outro arquivo atrás dela.
                        Pedido novo traz Deploy Request e um número. Leia o pedido inteiro com um único GET em `https://e7bot.even7.dev/admin/api/deploys/NÚMERO`. Não compile só com o título do Slack.
                        A resposta traz `buildAreas`, `tenants` (productId, name, appId), `deployToAll`, `branch`, `status`, `assignedTo`, `jiraTasks` e `suggestedCommands`. Esse JSON é o pedido. Se `branch` vier vazio, a base é master. Não abra o código para procurar defaultBranch.
                        Esta execução é uma menção ou uma continuação, não a abertura do card. Não espere 5 minutos.
                        Se o pedido ainda está `awaiting`, com `assignedTo` vazio, e a menção não pede para compilar agora, não faça assign e não compile. A abertura do card espera 5 minutos e segue se ninguém assumiu.
                        Se a menção pede para compilar agora, ou para corrigir um build que falhou, siga o pedido. Se já estiver assigned ou compiling, não chame assign de novo.
