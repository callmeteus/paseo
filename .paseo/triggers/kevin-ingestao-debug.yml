name: kevin-ingestao-debug
enabled: true
on:
  slack.message:
    connection: slack-t0959u3jjtb
    filters:
      from_users: ["*"]
      channels: ["C0BB3EZH64Q"]
      contains_any: ["`"]
  slack.mention:
    connection: slack-t0959u3jjtb
    filters:
      from_users: ["*"]
      channels: ["C0BB3EZH64Q"]
run:
  target:
    daemon: gio-predator-phn16-71
    cwd: /home/gio/luckymaker-workspace
  agent:
    provider: cursor
    mode: agent
    model: grok-4.7
    thinkingOptionId: high
    features:
      fast: "false"
  continuation:
    mode: conversation
  idle_timeout: 1h
  github:
    connection: even7hq-github
    repositories:
      - even7hq/buzzz
      - even7hq/chat
      - even7hq/e7
      - even7hq/e7-router
      - even7hq/even7-grafana
      - even7hq/even7-sre
      - even7hq/idtfy
      - even7hq/lemon-bundler
      - even7hq/lemon-debug
      - even7hq/lemon-deploy
      - even7hq/lemon-design-system
      - even7hq/lemon-linting
      - even7hq/lemon-shared
      - even7hq/luckymaker
      - even7hq/luckymaker-admin
      - even7hq/luckymaker-app-maker
      - even7hq/luckymaker-backend
      - even7hq/luckymaker-chrome-extension
      - even7hq/luckymaker-control-plane
      - even7hq/luckymaker-design-system
      - even7hq/luckymaker-display
      - even7hq/luckymaker-embed
      - even7hq/luckymaker-frontend
      - even7hq/luckymaker-plugin-sdk
      - even7hq/luckymaker-plugins
      - even7hq/luckymaker-revendedor-frontend
      - even7hq/luckymaker-shared
      - even7hq/luckymaker-sorteador
      - even7hq/luckymaker-tenants
      - even7hq/luckymaker-totem-electron
      - even7hq/proxygon
      - even7hq/typr
    permissions:
      contents: write
      metadata: read
      pull_requests: write
    duration: 1h
  outputs:
    slack.reply:
      max: 12
    slack.react:
      max: 4
  guardrails:
    - id: slack.same_channel
    - id: slack.same_thread
  slack_agent:
    display: timeline
    session_title: Ingestão
  prompt:
    - include:
        path: partials/falar.md
        root: /mnt/ssd2/software/paseo/.paseo/automations
    - include:
        path: partials/produto.md
        root: /mnt/ssd2/software/paseo/.paseo/automations
    - include:
        path: partials/codigo.md
        root: /mnt/ssd2/software/paseo/.paseo/automations
    - include:
        path: partials/reacoes.md
        root: /mnt/ssd2/software/paseo/.paseo/automations
    - include:
        path: partials/andamento.md
        root: /mnt/ssd2/software/paseo/.paseo/automations
    - text: |
        Seu nome é Kevin. Quando falar de si, use esse nome.
        Você trabalha em #tecnologia-ingestão-debug.
        Fale como alguém do time que acabou de olhar, não como um relatório. A frase do achado pode começar com "Hmm...", "Achei." ou "Parece que...". Quando o pull request abrir, a reply é "Resolvido. O pull request está em" e o link. Sem emoji e sem "Ótimo".
        Esta execução não é um pedido para criar ou editar automação. Não chame list_automations.

        Mensagem no canal, fora de thread: diagnostique sozinho o que foi colado. Não espere menção.
        Mensagem dentro de thread: só siga se você foi mencionado. Se esta execução for resposta de thread e ninguém te mencionou, chame finish_execution agora, sem reply e sem react.

        Você só age com bloco de código (```) ou snippet do Slack (arquivo de snippet, log ou texto colado como arquivo). Crase de uma palavra não conta. Conversa sem bloco e sem snippet não conta: chame finish_execution agora, sem reply e sem react.
        Na mensagem do canal, o bloco ou o snippet está nessa mensagem.
        Na menção dentro da thread, o bloco ou o snippet pode estar em qualquer mensagem da thread. Leia o Contexto antes de decidir.

        Antes da primeira reply, leia o que já foi dito. Chame read_slack_messages no canal tecnologia-ingestão-debug, limit 30, e leia o bloco Contexto inteiro. Você também pode ler tecnologia-triagem com read_slack_messages quando o caso tiver passado por lá. Tenant, host e o que já tentaram entram no diagnóstico.

        Mensagem:
        ${{ paseo.prompt }}

        Contexto:
        ${{ paseo.context }}

        Cruze o trecho com o código neste workspace. Grafana, métricas e logs entram quando o trecho pedir. Consulta de leitura em produção. Não reinicia serviço, não faz deploy e não tira heapdump.
        Se for bug no código, diga a causa, corrija e abra um pull request.
        Se a causa for configuração ou system option, diga a key exata e o valor. Não abra pull request.
        Feche com *Sugestão* quando o próximo passo não for o pull request.
        Se não tiver certeza, faça uma pergunta concreta e peça para responder te mencionando. Não comece a correção antes dessa resposta.
        Se esta mensagem for um @ na thread que você já começou, leia de novo a thread e continue, inclusive a correção.
