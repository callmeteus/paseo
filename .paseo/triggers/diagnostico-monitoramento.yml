name: diagnostico-monitoramento
enabled: true
on:
  slack.message:
    connection: slack-t0959u3jjtb
    filters:
      from_users: ["U09FFH54LM9"]
      channels: ["C096V21TE0K"]
      include_bots: true
      contains_all: ["ALERTA:"]
      contains_any: ["CPU", "RAM", "Memória", "firewall", "WAF", "ataque", "DDoS", "flood"]
  slack.mention:
    connection: slack-t0959u3jjtb
    filters:
      from_users: ["*"]
      channels: ["C096V21TE0K"]
run:
  target:
    daemon: gio-predator-phn16-71
    cwd: /home/gio/luckymaker-workspace
  agent:
    provider: cursor
    mode: agent
  continuation:
    mode: conversation
  idle_timeout: 45m
  outputs:
    slack.reply:
      max: 16
  guardrails:
    - id: slack.same_channel
    - id: slack.same_thread
  slack_agent:
    display: plan
    plan_title: Diagnóstico
    session_title: Alerta
  prompt:
    - include:
        path: partials/falar.md
        root: /mnt/ssd2/software/paseo/.paseo/automations
    - include:
        path: partials/produto.md
        root: /mnt/ssd2/software/paseo/.paseo/automations
    - include:
        path: partials/andamento.md
        root: /mnt/ssd2/software/paseo/.paseo/automations
    - text: |
        Você diagnostica um alerta que acabou de chegar em #tecnologia-monitoramento.

        Se esta execução for um @ na thread que você já começou, continue o diagnóstico a partir do que a pessoa perguntou. A primeira reply dessa continuação sai logo. O resto desta instrução, sobre burst, não se aplica a essa menção.

        A primeira ação, antes de reply e antes de qualquer Task, é read_slack_messages no canal tecnologia-monitoramento, limit 20. Você também pode ler tecnologia-triagem com read_slack_messages quando o alerta tiver passado por lá.
        Se a sua mensagem contém RESOLVIDO, chame finish_execution agora. Sem reply e sem subagente.
        Se a sua mensagem, ou o alerta mais antigo do grupo, contém "Ack dado por", chame finish_execution agora. Sem reply e sem subagente. Alerta com ACK não é investigado. O título pode continuar ALERTA. A linha do ACK vem no texto que read_slack_messages devolve.
        O grupo é o seu alerta e os outros ALERTA dos últimos 20 minutos que citam a mesma instância ou o mesmo recurso. A instância é o id entre parênteses. Sem esse id, vale o mesmo host, tenant ou serviço no título. Mensagem de resolvido não entra no grupo. Mensagem com "Ack dado por" também não entra.
        Antes de mitigar e antes de fechar, leia o canal de novo. Se o alerta ganhou "Ack dado por", pare. Sem Task nova e sem regra.
        Quem trabalha é só o alerta mais antigo desse grupo. Um alerta de 70% e outro de 90%, dez minutos depois, na mesma instância, são o mesmo caso. O mais novo não abre investigação.
        Se a sua mensagem não for a mais antiga do grupo, chame finish_execution agora. Sem reply, sem Task, sem métrica, sem log, sem heapdump. Hub abre uma execução por mensagem. A sua, se não for a primeira, existe só para encerrar.
        Se a sua for a mais antiga, a investigação é uma só. Antes de fechar, leia o canal de novo e inclua os limiares da mesma instância que chegaram enquanto você trabalhava.

        Quando você for quem comunica, a primeira reply diz qual é o alerta, ou o grupo. As frentes entram no plano com slack_stage, uma por frente, antes de disparar os subagentes.

        Depois dessa primeira reply, dispare os subagentes juntos, na mesma mensagem, pela ferramenta Task. Um subagente por frente. Não faça essas leituras você mesmo, uma atrás da outra. Cada um devolve um relatório curto. Nenhum deles chama reply, react ou finish_execution, e nenhum cria regra. Quem fala no canal e quem mitiga é você.
        No prompt de cada um, cole o alerta, a instância ou o recurso, o tenant e a janela dos minutos do alerta. Peça só o que ele viu e a conclusão.

        As frentes, quando o alerta for CPU, RAM ou memória de máquina que recebe HTTP:
        - Requisições, no namespace e7: top-hosts, top-paths, top-ips e events. Procure scanner, não só "CPU alta". Caminho de sonda (`/.env`, `wp-login`, `xmlrpc`, `userfiles`, `proc/self`), vários hostnames que não são o site (adminer, proxmox, vault, erp) com a mesma contagem, um IP ou um user-agent repetindo, ou uma varredura do site público, inclusive o blog. Tráfego normal de cliente e callback de pagamento não são ataque.
        - Métrica dessa instância: o que subiu junto com o alerta.
        - Log de acesso ou do processo dessa máquina, na mesma janela.

        RDS, Redis e ElastiCache ficam numa frente só, a métrica. Não dispare WAF para eles.

        Quando os relatórios voltarem, você decide. Se for scanner e der para cortar sem derrubar usuário de verdade, callback de pagamento ou o host inteiro do site, mitigue. Leia o schema de condição do WAF e crie uma regra estreita, `block` ou `temp_block`, no que é a sonda ou o hostname falso. Diga no canal o que bloqueou e o nome da regra. Se o padrão também for tráfego de cliente, não bloqueie: conte o que viu.
        Heapdump e profiling só quando os relatórios ainda apontam o processo Node de um tenant. Use as ferramentas de produção de heapdump e profiler, com o appId desse tenant. O profiling fica em 30 segundos.
        Feche com a causa e o que fazer agora. Se você bloqueou alguma coisa, a causa inclui o que estava batendo na máquina.

        Esta mensagem já passou no filtro. Não decida de novo se o alerta merece diagnóstico. RESOLVIDO e "Ack dado por" continuam sendo motivo para parar.

        Mensagem:
        ${{ paseo.prompt }}

        Contexto:
        ${{ paseo.context }}
